name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/standalone/
            .next/static/
            public/
          include-hidden-files: true
          retention-days: 1

  package:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .

      - name: Verify build artifact
        run: |
          echo "Checking .next/standalone..."
          ls -la .next/standalone/ | head -10
          echo "Checking .next/static..."
          ls -la .next/static/ | head -5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/waushop/raha
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/waushop/raha
            ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-wauhost:
    # Commits the new short-SHA image tag to wauhost/services/raha/values.yaml
    # so Flux deploys only this app. Requires Actions secret WAUHOST_DEPLOY_KEY
    # (private half of the write-enabled deploy key registered on wauhost).
    name: Bump wauhost image tag
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    concurrency:
      # Serialize bumps from THIS repo. Cross-repo races on wauhost main are
      # handled by the rebase-retry in the push step below.
      group: bump-wauhost
      cancel-in-progress: false
    steps:
      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Checkout wauhost
        uses: actions/checkout@v4
        with:
          repository: waushop/wauhost
          ssh-key: ${{ secrets.WAUHOST_DEPLOY_KEY }}
          path: wauhost

      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tag
        working-directory: wauhost
        run: |
          tag='${{ steps.sha.outputs.short }}'
          yq -i ".image.tag = \"$tag\"" services/raha/values.yaml
          echo "--- diff ---"
          git --no-pager diff services/raha/values.yaml

      - name: Commit + push
        working-directory: wauhost
        run: |
          git config user.name  'raha-ci'
          git config user.email 'raha-ci@users.noreply.github.com'
          if git diff --quiet services/raha/values.yaml; then
            echo "No tag change — skipping commit."
            exit 0
          fi
          git add services/raha/values.yaml
          git commit -m "chore(raha): bump image tag to ${{ steps.sha.outputs.short }}

          Auto-bumped by raha deploy.yml after building image
          ghcr.io/waushop/raha:${{ steps.sha.outputs.short }}.
          Flux reconciles within 5m."
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push rejected (attempt $i), rebasing onto latest main…"
            git pull --rebase origin main
            sleep $((i * 2))
          done
          echo "✗ push failed after 5 attempts"
          exit 1

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          - Image tag: \`${{ steps.sha.outputs.short }}\`
          - Wauhost: https://github.com/waushop/wauhost (commit pushed to bump tag)

          Flux reconciles within 5m. Force now:
          \`flux reconcile helmrelease raha -n flux-system --with-source\`
          EOF
