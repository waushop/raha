networks:
  traefik_proxy:
    external: true

services:
  raha:
    container_name: raha
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_PIN_HASH: ${AUTH_PIN_HASH}
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.raha.rule=Host(`raha.vaus.ee`)"
      - "traefik.http.routers.raha.entrypoints=websecure"
      - "traefik.http.routers.raha.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.rahaservice.loadbalancer.server.port=3000"
