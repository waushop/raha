services:
  mysql:
    image: mysql:8
    container_name: raha-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: raha
      MYSQL_DATABASE: raha
    ports:
      - "3306:3306"
    volumes:
      - raha_mysql_data:/var/lib/mysql
      - ./lib/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  raha_mysql_data:
